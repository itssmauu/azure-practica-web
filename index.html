<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Práctica Azure</title></head>
<body>
  <h1>Mi práctica en Azure</h1>
  <button onclick="llamar()">Llamar a la API</button>
  <pre id="out"></pre>
  <script>
    // Cambia por la URL de tu API (con https:// y sin / al final)
    const API = "https://api-mauro-hack-123-cudgh7fke8efexh3.northcentralus-01.azurewebsites.net";
    async function llamar() {
      try {
        const r = await fetch(API + "/api/hello");
        document.getElementById("out").textContent = JSON.stringify(await r.json(), null, 2);
      } catch (e) { document.getElementById("out").textContent = "Error: " + e; }
    }
  </script>
</body>
</html>
